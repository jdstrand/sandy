name: Coverage

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install test tools
        run: make install-tools

      - name: Run coverage
        run: make coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            .venv-test/bin/coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
