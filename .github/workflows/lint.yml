name: Linters and static checkers

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install test tools
        run: make install-tools

      - name: Run formatting check
        run: make format-check

      - name: Run type check
        run: make type-check

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run ShellCheck
        run: make shell-check

  inclusivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"

      - name: Install language-checker
        run: |
          GOBIN="$RUNNER_TEMP" go install github.com/jdstrand/language-checker@9944da58f4e35951cbdcd25416e473fbd19f12ed
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run inclusivity check
        run: make inclusivity-check
